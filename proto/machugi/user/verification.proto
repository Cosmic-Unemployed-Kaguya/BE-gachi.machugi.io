syntax = "proto3";

package machugi.verification;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "validate/validate.proto";
import "google/rpc/error_details.proto";  // 에러 처리용

option java_multiple_files = true;
option java_package = "kaguya.grpc.verification";

service VerificationService {

  rpc SendVerificationCode (SendVerificationCodeRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/verifications/send"
      body: "*"
    };
  }

  rpc CheckVerificationCode (CheckVerificationCodeRequest) returns (CheckVerificationCodeResponse) {
    option (google.api.http) = {
      post: "/verifications/check"
      body: "*"
    };
  }
}


// --- Enums ---
enum GrpcVerificationType {
  VERIFICATION_TYPE_UNSPECIFIED = 0;
  REGISTER = 1;
  RESET_PASSWORD = 2;
  REACTIVATE_ACCOUNT = 3;
}


// --- Request Messages ---
message SendVerificationCodeRequest {
  GrpcVerificationType verification_type = 1 [(validate.rules).enum = {
    defined_only: true,
    not_in: [0]  // UNSPECIFIED(0) 허용 안 함 (필수값)
  }];
  string email = 3 [(validate.rules).string = {
    email: true,
    max_len: 254
  }];
}

message CheckVerificationCodeRequest {
  GrpcVerificationType verification_type = 1 [(validate.rules).enum = {
    defined_only: true,
    not_in: [0]
  }];
  string verificationCode = 2 [(validate.rules).string = {
    pattern: "^[a-zA-Z0-9]{6}$"  // 6자리 영문 대소문자, 숫자 검증
  }];
  string email = 3 [(validate.rules).string = {
    email: true,
    max_len: 254
  }];
}


// --- Response Messages ---
message CheckVerificationCodeResponse {
    string one_time_auth_code = 1;
}