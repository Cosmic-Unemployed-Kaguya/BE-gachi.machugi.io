name: 이슈 지라와 연결 워크플로우

on:
  issues:
    types:
      - opened

permissions:
  issues: write
  contents: read

jobs:
  create-jira-issue:
    name: Create Jira Issue
    runs-on: ubuntu-latest

    steps:
      # GitHub Issue에서 프로젝트 키와 이슈 정보 추출
      - name: Get issue data
        id: issue-data
        uses: actions/github-script@v8
        with:
          script: |
            const title = context.payload.issue.title;
            const body = context.payload.issue.body || "";
            const issueNumber = context.payload.issue.number;
            const issueUrl = context.payload.issue.html_url;

            let projectKey = "";

            // 서비스명 스캔
            const titleMatch = title.match(/\[(USER|BOARD|QUIZ|ROOM)\]/i);
            const bodyMatch = body.match(/\b(USER|BOARD|QUIZ|ROOM)-\d+\b/i);

            if (titleMatch) {
              projectKey = titleMatch[1].toUpperCase();
            } else if (bodyMatch) {
              projectKey = bodyMatch[1].toUpperCase();
            }

            if (!projectKey) {
              core.setFailed("Jira project key를 찾을 수 없습니다. 제목에 [USER], [BOARD], [QUIZ], [ROOM] 중 하나를 포함해주세요.");
              return;
            }

            // IS / SUB 코드로 Epic과 Task 구분
            const isMatch = title.match(/\[(IS\d{3})\]/i);
            const subMatch = title.match(/\[(SUB\d{3})\]/i);

            if (!isMatch) {
              core.setFailed("IS 코드를 찾을 수 없습니다. 제목에 [IS001] 형식으로 입력해주세요.");
              return;
            }

            const isCode = isMatch[1].toUpperCase();
            const subCode = subMatch ? subMatch[1].toUpperCase() : "";
            const issueType = subCode ? "Task" : "Epic";

            core.setOutput("project_key", projectKey);
            core.setOutput("title", title);
            core.setOutput("body", body);
            core.setOutput("issue_number", issueNumber);
            core.setOutput("issue_url", issueUrl);
            core.setOutput("is_code", isCode);
            core.setOutput("sub_code", subCode);
            core.setOutput("issue_type", issueType);

      # 기존 방식으로 부모 Epic 검색
      - name: Find parent epic
        id: find-parent-epic
        if: steps.issue-data.outputs.issue_type == 'Task'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          PROJECT_KEY: ${{ steps.issue-data.outputs.project_key }}
          IS_CODE: ${{ steps.issue-data.outputs.is_code }}
        run: |
          is_label=$(printf '%s' "$IS_CODE" | tr '[:upper:]' '[:lower:]')

          jql="project = $PROJECT_KEY AND issuetype = Epic AND labels = $is_label ORDER BY created DESC"

          encoded_jql=$(printf '%s' "$jql" | python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.stdin.read()))')

          response=$(curl -sS \
            -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            -X GET \
            -H "Accept: application/json" \
            "${JIRA_BASE_URL%/}/rest/api/3/search?jql=$encoded_jql&fields=key&maxResults=1")

          printf '%s\n' "$response"

          parent_key=$(printf '%s' "$response" | jq -r '.issues[0].key // empty')

          if [ -z "$parent_key" ]; then
            echo "상위 Epic을 찾을 수 없습니다."
            echo "먼저 [$PROJECT_KEY][$IS_CODE] 형식의 Epic 이슈를 생성해주세요."
            exit 1
          fi

          echo "parent_key=$parent_key" >> "$GITHUB_OUTPUT"

      # 제목과 본문을 jq로 JSON 변환한 뒤 Jira Issue 생성
      - name: Create Jira issue
        id: create-jira
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          PROJECT_KEY: ${{ steps.issue-data.outputs.project_key }}
          ISSUE_TYPE: ${{ steps.issue-data.outputs.issue_type }}
          ISSUE_TITLE: ${{ steps.issue-data.outputs.title }}
          ISSUE_BODY: ${{ steps.issue-data.outputs.body }}
          ISSUE_URL: ${{ steps.issue-data.outputs.issue_url }}
          IS_CODE: ${{ steps.issue-data.outputs.is_code }}
          SUB_CODE: ${{ steps.issue-data.outputs.sub_code }}
          PARENT_KEY: ${{ steps.find-parent-epic.outputs.parent_key }}
        run: |
          echo "project_key=$PROJECT_KEY"
          echo "issue_type=$ISSUE_TYPE"

          is_label=$(printf '%s' "$IS_CODE" | tr '[:upper:]' '[:lower:]')
          sub_label=$(printf '%s' "$SUB_CODE" | tr '[:upper:]' '[:lower:]')

          payload=$(jq -n \
            --arg project "$PROJECT_KEY" \
            --arg title "$ISSUE_TITLE" \
            --arg body "$ISSUE_BODY" \
            --arg url "$ISSUE_URL" \
            --arg issue_type "$ISSUE_TYPE" \
            --arg is_label "$is_label" \
            --arg sub_label "$sub_label" \
            --arg parent "$PARENT_KEY" \
            '{
              fields: {
                project: {
                  key: $project
                },
                summary: $title,
                description: {
                  type: "doc",
                  version: 1,
                  content: (
                    [{
                      type: "paragraph",
                      content: [{
                        type: "text",
                        text: ("Github Issue: " + $url)
                      }]
                    }]
                    + (
                      if $body == "" then []
                      else [{
                        type: "paragraph",
                        content: [{
                          type: "text",
                          text: $body
                        }]
                      }]
                      end
                    )
                  )
                },
                issuetype: {
                  name: $issue_type
                },
                labels: (
                  [$is_label, "github"]
                  + (
                    if $sub_label == "" then []
                    else [$sub_label]
                    end
                  )
                )
              }
            }
            | if $issue_type == "Task"
              then .fields.parent = {key: $parent}
              else .
              end')

          response=$(curl -sS \
            -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            -X POST \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "${JIRA_BASE_URL%/}/rest/api/3/issue" \
            --data "$payload")

          printf '%s\n' "$response"

          jira_key=$(printf '%s' "$response" | jq -r '.key // empty')

          if [ -z "$jira_key" ]; then
            echo "Jira Issue 생성 실패"
            exit 1
          fi

          jira_url="${JIRA_BASE_URL%/}/browse/$jira_key"

          echo "jira_key=$jira_key" >> "$GITHUB_OUTPUT"
          echo "jira_url=$jira_url" >> "$GITHUB_OUTPUT"

      # 생성된 Jira 링크를 GitHub Issue 댓글로 작성
      - name: Comment Jira issue link
        uses: actions/github-script@v8
        env:
          JIRA_KEY: ${{ steps.create-jira.outputs.jira_key }}
          JIRA_URL: ${{ steps.create-jira.outputs.jira_url }}
          ISSUE_TYPE: ${{ steps.issue-data.outputs.issue_type }}
        with:
          script: |
            const jiraKey = process.env.JIRA_KEY;
            const jiraUrl = process.env.JIRA_URL;
            const issueType = process.env.ISSUE_TYPE;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `Jira ${issueType}가 생성되었습니다.\n\n- ${jiraKey}: ${jiraUrl}`
            });
