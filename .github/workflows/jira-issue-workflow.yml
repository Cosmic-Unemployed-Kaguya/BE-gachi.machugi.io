name: 이슈 지라와 연결 워크플로우

on:
  issues:
    types:
      - opened

permissions:
  issues: write
  contents: read

jobs:
  create-jira-issue:
    name: Create Jira Issue
    runs-on: ubuntu-latest

    steps:
      - name: Create Jira issue and comment link
        uses: actions/github-script@v8
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title;
            const body = issue.body || "";

            // 프로젝트 키 확인
            const titleMatch = title.match(/\[(USER|BOARD|QUIZ|ROOM)\]/i);
            const bodyMatch = body.match(/\b(USER|BOARD|QUIZ|ROOM)-\d+\b/i);

            const projectKey = (
              titleMatch?.[1] || bodyMatch?.[1] || ""
            ).toUpperCase();

            if (!projectKey) {
              core.setFailed(
                "Jira project key를 찾을 수 없습니다. 제목에 [USER], [BOARD], [QUIZ], [ROOM] 중 하나를 포함해주세요."
              );
              return;
            }

            // IS / SUB 코드 확인
            const isMatch = title.match(/\[(IS\d{3})\]/i);
            const subMatch = title.match(/\[(SUB\d{3})\]/i);

            if (!isMatch) {
              core.setFailed(
                "IS 코드를 찾을 수 없습니다. 제목에 [IS001] 형식으로 입력해주세요."
              );
              return;
            }

            const isCode = isMatch[1].toUpperCase();
            const subCode = subMatch ? subMatch[1].toUpperCase() : "";
            const issueType = subCode ? "Task" : "Epic";

            const isLabel = isCode.toLowerCase();
            const subLabel = subCode.toLowerCase();

            const baseUrl = (process.env.JIRA_BASE_URL || "")
              .trim()
              .replace(/\/+$/, "");
            const email = process.env.JIRA_USER_EMAIL;
            const token = process.env.JIRA_API_TOKEN;

            if (!baseUrl || !email || !token) {
              core.setFailed(
                "JIRA_BASE_URL, JIRA_USER_EMAIL, JIRA_API_TOKEN Secrets를 확인해주세요."
              );
              return;
            }

            const authorization = "Basic " + Buffer
              .from(`${email}:${token}`)
              .toString("base64");

            core.setSecret(authorization);

            // Jira API 호출
            async function jiraRequest(path, method, payload) {
              const response = await fetch(`${baseUrl}${path}`, {
                method,
                headers: {
                  Authorization: authorization,
                  Accept: "application/json",
                  "Content-Type": "application/json"
                },
                body: payload === undefined
                  ? undefined
                  : JSON.stringify(payload)
              });

              const responseText = await response.text();

              if (!response.ok) {
                throw new Error(
                  `Jira API 실패: ${method} ${path}\n` +
                  `HTTP ${response.status}\n${responseText}`
                );
              }

              if (!responseText) {
                return {};
              }

              try {
                return JSON.parse(responseText);
              } catch {
                throw new Error(
                  `Jira API가 JSON이 아닌 응답을 반환했습니다. HTTP ${response.status}`
                );
              }
            }

            // Task인 경우 같은 IS 라벨의 부모 Epic 검색
            let parentKey = "";

            if (issueType === "Task") {
              const jql =
                `project = "${projectKey}" ` +
                `AND issuetype = Epic ` +
                `AND labels = "${isLabel}" ` +
                `ORDER BY created DESC`;

              const searchResult = await jiraRequest(
                "/rest/api/3/search/jql",
                "POST",
                {
                  jql,
                  fields: ["key"],
                  maxResults: 1
                }
              );

              parentKey = searchResult.issues?.[0]?.key || "";

              if (!parentKey) {
                core.setFailed(
                  "상위 Epic을 찾을 수 없습니다. " +
                  `먼저 [${projectKey}][${isCode}] 형식의 Epic 이슈를 생성해주세요.`
                );
                return;
              }

              core.info(`부모 Epic: ${parentKey}`);
            }

            // Jira 설명을 ADF 문서 형식으로 생성
            const descriptionContent = [
              {
                type: "paragraph",
                content: [
                  {
                    type: "text",
                    text: `GitHub Issue: ${issue.html_url}`
                  }
                ]
              }
            ];

            if (body) {
              const lines = body.replace(/\r\n?/g, "\n").split("\n");

              for (const line of lines) {
                descriptionContent.push({
                  type: "paragraph",
                  content: line
                    ? [{ type: "text", text: line }]
                    : []
                });
              }
            }

            const labels = [isLabel, "github"];

            if (subLabel) {
              labels.push(subLabel);
            }

            const fields = {
              project: {
                key: projectKey
              },
              summary: title,
              description: {
                type: "doc",
                version: 1,
                content: descriptionContent
              },
              issuetype: {
                name: issueType
              },
              labels
            };

            if (parentKey) {
              fields.parent = {
                key: parentKey
              };
            }

            // Jira 이슈 생성
            const createdIssue = await jiraRequest(
              "/rest/api/3/issue",
              "POST",
              { fields }
            );

            const jiraKey = createdIssue.key;

            if (!jiraKey) {
              core.setFailed("Jira Issue 생성 응답에 key가 없습니다.");
              return;
            }

            const jiraUrl = `${baseUrl}/browse/${jiraKey}`;

            core.info(`Jira ${issueType} 생성 완료: ${jiraKey}`);

            // GitHub 이슈에 Jira 링크 댓글 작성
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body:
                `Jira ${issueType}가 생성되었습니다.\n\n` +
                `- ${jiraKey}: ${jiraUrl}`
            });
